<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cynect</title>
<meta name="description" content="Cynect — כל מה שהוא לא יכול לספר לך. בפיתוח.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5B3DF5">
<link rel="icon" type="image/png" sizes="180x180" href="/brand/favicon-180.png">
<link rel="apple-touch-icon" href="/brand/favicon-180.png">
<style>
  @font-face {
    font-family: 'Heebo';
    src: url('/fonts/heebo/Heebo-VariableFont_wght.ttf') format('truetype');
    font-weight: 400 700;
    font-display: swap;
  }
  :root {
    --brand:#5B3DF5;
    --ink:#1B1626;
    --muted:#57506B;
    --surface:#FFFFFF;
    --line:#E7E1FB;
    --wash-a:#F4F0FE;
    --wash-b:#FBFAFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand:#9B87FF; --ink:#F3F0FF; --muted:#9C94B4;
      --surface:#171327; --line:#2C2444; --wash-a:#100D1C; --wash-b:#17122A;
    }
  }
  * { box-sizing:border-box }
  html { height:100% }
  body {
    margin:0; padding:32px 20px; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:48px;
    font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 50% -12%, var(--wash-a), transparent 62%),
      var(--wash-b);
  }
  main {
    width:100%; max-width:560px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:28px;
  }
  .logo { width:clamp(230px, 26vw, 380px); height:auto; display:block }
  .logo--dark { display:none }
  @media (prefers-color-scheme: dark) {
    .logo--light { display:none }
    .logo--dark  { display:block }
  }
  p.lead {
    margin:0; font-size:clamp(19px, 2.6vw, 26px); font-weight:400;
    line-height:1.6; color:var(--ink); max-width:22ch; letter-spacing:-0.2px; font-weight:400;
  }
  hr { width:56px; height:2px; border:0; border-radius:2px; background:var(--line); margin:8px 0 }
  nav { display:flex; flex-wrap:wrap; justify-content:center; gap:10px }
  nav a {
    display:inline-block; padding:11px 20px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--ink); text-decoration:none; font-size:15px; font-weight:600;
    transition:border-color .15s ease, color .15s ease, transform .15s ease;
  }
  nav a:hover { border-color:var(--brand); color:var(--brand); transform:translateY(-1px) }
  nav a:focus-visible { outline:2px solid var(--brand); outline-offset:3px }
  footer { font-size:13px; color:var(--muted) }
  @media (max-width:420px) { body { gap:32px } nav { flex-direction:column; width:100%; max-width:280px } }
  @media (prefers-reduced-motion:reduce) { nav a { transition:none } }
</style>
</head>
<body>
  <main>
    <img class="logo logo--light" src="/brand/cynect-wordmark-purple.svg" alt="Cynect" width="1913" height="734">
    <img class="logo logo--dark"  src="/brand/cynect-wordmark-white.svg"  alt="Cynect" width="1913" height="734">
    <p class="lead">כל מה שהוא לא יכול לספר לך.</p>
    <hr>
    <nav>
      <a href="/privacy.html">מדיניות פרטיות</a>
      <a href="/terms.html">תנאי שימוש</a>
      <a href="/support.html">תמיכה</a>
    </nav>
  </main>
  <footer>בפיתוח · Cynect</footer>
</body>
</html>
