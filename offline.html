<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>אין חיבור לאינטרנט — Dogo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #6C5CE7;
      --surface: #ffffff;
      --body: #374151;
      --muted: #6B7280;
      --border: #F3F4F6;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--surface);
      color: var(--body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
      padding-inline: 24px;
      gap: 0;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      padding: 40px 24px;
    }

    .icon-wrap {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: #F5F3FF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 48px;
      height: 48px;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: -0.5px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--body);
      line-height: 1.3;
    }

    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 12px;
      background: var(--purple);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 240px;
      transition: opacity 0.15s;
      text-decoration: none;
    }

    .btn:active { opacity: 0.8; }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Dogo 🐾</div>

    <div class="icon-wrap" aria-hidden="true">
      <!-- wifi-off icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#6C5CE7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <h1>אין חיבור לאינטרנט</h1>
      <p>נראה שאתה לא מחובר לאינטרנט כרגע.<br/>בדוק את החיבור שלך ונסה שוב.</p>
    </div>

    <div class="divider"></div>

    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      נסה שוב
    </button>

    <p class="hint">אם יש לך גישה קודמת — תוכן שמור עשוי להיות זמין</p>
  </div>
</body>
</html>
