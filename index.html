<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קיינקט</title>
<meta name="description" content="קיינקט — אפליקציית הכלבים הישראלית. בפיתוח.">
<meta name="robots" content="noindex">
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --brand:#6C5CE7; --bg:#F0ECFD; --line:#DDD6FE }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif }
  main { max-width:420px; width:100%; text-align:center;
         background:#fff; border:1px solid var(--line); border-radius:24px; padding:40px 32px }
  h1 { margin:0 0 8px; font-size:32px; letter-spacing:-0.5px; color:var(--brand) }
  p  { margin:0 0 32px; color:var(--muted); line-height:1.7; font-size:16px }
  nav { display:flex; flex-direction:column; gap:12px }
  a { color:var(--ink); text-decoration:none; font-size:15px;
      border:1px solid var(--line); border-radius:12px; padding:12px 16px }
  a:hover { border-color:var(--brand); color:var(--brand) }
</style>
</head>
<body>
  <main>
    <h1>קיינקט</h1>
    <p>אפליקציית הכלבים הישראלית.<br>בפיתוח, בקרוב.</p>
    <nav>
      <a href="/privacy.html">מדיניות פרטיות</a>
      <a href="/terms.html">תנאי שימוש</a>
      <a href="/support.html">תמיכה</a>
    </nav>
  </main>
</body>
</html>
